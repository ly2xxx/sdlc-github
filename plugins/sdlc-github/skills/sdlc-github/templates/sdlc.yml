name: SDLC Pipeline

# One run, one line: idea -> intent.md -> spec.md -> plan.md (Ollama Cloud) -> build
# (Claude Code or a person; step 4 waits for it) -> verify -> Ollama review -> pull
# request. The pipeline is the reusable workflow in ly2xxx/.github:
# https://github.com/ly2xxx/.github/blob/main/.github/workflows/README.md
#
# Start it: Run workflow with an idea, or open an issue labelled "sdlc" (title = idea;
# "feature: <name>" in the body revises that feature, and with "start: build" runs only
# steps 5-6).
#
# One-time setup (Settings):
#   Secrets and variables -> Actions: OLLAMA_API_KEY (secret). Optional variables:
#     OLLAMA_MODEL (empty uses the pipeline's default) and OLLAMA_THINK.
#   Optional: Actions -> General -> "Allow GitHub Actions to create and approve pull
#     requests", or an SDLC_PR_TOKEN secret, so step 6 opens the pull request itself.
#   Optional: Environments -> sdlc-review -> Required reviewers, to pause at each review job.

run-name: "SDLC · ${{ inputs.feature || inputs.idea || github.event.issue.title }} · from ${{ inputs.start || 'issue' }} · ${{ inputs.builder || 'claude' }}"

on:
  workflow_dispatch:
    inputs:
      idea:
        description: "Idea (one line). Starts a new feature, or revises the feature named below."
        required: false
      feature:
        description: "Existing feature folder under sdlc/features. Alone, once built, it runs verify and opens the PR."
        required: false
      start:
        description: "Where to start. auto = intent with an idea, else the first missing document, else the build run."
        type: choice
        options: [auto, intent, spec, plan, build]
        default: auto
      builder:
        description: "Who builds at step 4."
        type: choice
        options: [claude, human]
        default: claude
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  sdlc:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'sdlc'
    uses: ly2xxx/.github/.github/workflows/sdlc.yml@main
    with:
      idea: ${{ inputs.idea || github.event.issue.title || '' }}
      feature: ${{ inputs.feature }}
      start: ${{ inputs.start }}
      builder: ${{ inputs.builder }}
      model: ${{ vars.OLLAMA_MODEL }}
      think: ${{ vars.OLLAMA_THINK }}
      # The whole test suite; it must fail when it finds no tests. npm test for Node.js.
      test-command: python -m pytest -q
      build-wait-minutes: 180
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      SDLC_PR_TOKEN: ${{ secrets.SDLC_PR_TOKEN }}
