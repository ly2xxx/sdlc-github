name: SDLC Phase Check

# Checks one built phase (a pull request from phase/<feature>/<n> into
# feature/<feature>) against the approved plan before it is merged. The check is the
# reusable workflow in ly2xxx/.github.

on:
  pull_request:
    branches: ["feature/**"]

permissions:
  contents: read

jobs:
  phase:
    uses: ly2xxx/.github/.github/workflows/sdlc-phase.yml@main
    with:
      # The same test suite as sdlc.yml.
      test-command: python -m pytest -q
